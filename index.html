<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>سباق الدراسات 🏍️</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--o:#ff4d00;--c:#00e5ff;--g:#39ff88;--r:#ff2d55}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Cairo,Tahoma,sans-serif;color:#fff;background:radial-gradient(circle at 50% 120%,#3a0d00,#07070f 60%);overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:16px}
h1{font-size:clamp(28px,7vw,46px);font-weight:900;text-align:center;background:linear-gradient(90deg,var(--o),#ffd000,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #ff4d0055}
.card{background:rgba(15,15,35,.82);border:2px solid #ffffff22;border-radius:22px;padding:20px;margin-top:16px;backdrop-filter:blur(6px);box-shadow:0 0 40px #ff4d0033,inset 0 0 30px #00e5ff10;animation:pop .45s}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.95)}}
input{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--c);background:#0008;color:#fff;text-align:center;outline:none;margin:14px 0}
button{font:inherit;cursor:pointer;color:#fff;border:0}
.go{width:100%;font-size:22px;font-weight:900;padding:14px;border-radius:16px;background:linear-gradient(90deg,var(--o),#ff9500);box-shadow:0 6px 0 #8a2800;transition:.15s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #8a2800}
.go:disabled{opacity:.4;filter:grayscale(1)}
.bike{font-size:60px;text-align:center;animation:rock 1s infinite}
@keyframes rock{50%{transform:translateX(-12px) rotate(-4deg)}}
#track{position:relative;height:46px;margin-top:10px;border-bottom:4px dashed #ffd000aa}
#bike{position:absolute;right:0;bottom:-2px;font-size:34px;transition:right .8s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 0 8px var(--o))}
#flag{position:absolute;left:0;bottom:0;font-size:28px}
.info{display:flex;justify-content:space-between;font-weight:600;color:#ffd000;margin-top:8px}
.q{font-size:clamp(19px,4.6vw,25px);font-weight:900;line-height:1.7;margin-bottom:14px}
.opt{display:block;width:100%;text-align:right;font-size:clamp(16px,4vw,20px);font-weight:600;padding:13px 16px;margin:9px 0;border-radius:14px;background:#ffffff12;border:2px solid #ffffff30;transition:.18s}
.opt:hover:not(:disabled){transform:translateX(-6px);border-color:var(--c);box-shadow:0 0 18px #00e5ff55}
.opt.ok{background:#39ff8833;border-color:var(--g);box-shadow:0 0 25px var(--g)}
.opt.no{background:#ff2d5533;border-color:var(--r)}
.hint{background:#ffd00022;color:#ffd000;border:2px dashed #ffd000;padding:9px 14px;border-radius:12px;font-weight:600}
#hbox{margin-top:10px;display:none;padding:10px;border-radius:12px;background:#ffd00018;border:1px solid #ffd00066;color:#ffe680}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1}
.big{font-size:70px;font-weight:900;text-align:center;color:var(--g);text-shadow:0 0 30px var(--g)}
.rv{font-size:15px;padding:8px 10px;border-right:4px solid var(--r);margin:7px 0;background:#ffffff0c;border-radius:8px}
.hide{display:none}
</style></head><body>
<canvas id="cv"></canvas>
<main>
<h1>🏍️ سباق الدراسات 🏁</h1>

<section id="gate" class="card">
  <div class="bike">🏍️💨</div>
  <p style="text-align:center;font-size:19px;font-weight:600">يا بطل، اكتب اسمك الأول وبعدين ابدأ السباق!</p>
  <input id="nm" placeholder="اكتب اسمك هنا..." maxlength="30" autocomplete="off">
  <p id="err" style="color:var(--r);text-align:center;min-height:24px"></p>
  <button class="go" id="start">🔥 ابدأ الامتحان</button>
</section>

<section id="exam" class="hide">
  <div class="info"><span id="who"></span><span id="cnt"></span><span id="sc"></span></div>
  <div id="track"><span id="flag">🏁</span><span id="bike">🏍️</span></div>
  <div class="card" id="box"></div>
</section>

<section id="end" class="hide card"></section>
</main>

<script>
// [السؤال, الإجابة الصحيحة, خاطئة1, خاطئة2, خاطئة3, تلميح]
const Q=[
["مساحة قارة آسيا تقريبًا:","44 مليون كم²","30 مليون كم²","10 مليون كم²","55 مليون كم²","هي أكبر قارات العالم مساحة، أكثر من أربعة أمثال أوروبا"],
["ترتيب قارة أوروبا بين قارات العالم من حيث المساحة:","ثاني أصغر القارات","أصغر القارات","ثالث أكبر القارات","أكبر القارات","لا يصغرها إلا قارة أستراليا"],
["الحد الفاصل بين قارتي آسيا وأوروبا من الشرق:","جبال الأورال","جبال الألب","جبال الهيمالايا","جبال البرانس","تمتد من الشمال للجنوب داخل روسيا"],
["أعلى قمة جبلية في آسيا والعالم:","إفرست","فوجي","أرارات","كلمنجارو","تقع في سلسلة جبال الهيمالايا"],
["أخفض نقطة على سطح اليابسة في العالم:","البحر الميت","بحر قزوين","بحيرة بايكال","بحر الأرال","تقع في غرب آسيا بين الأردن وفلسطين"],
["أعمق بحيرة في العالم وتقع في آسيا:","بحيرة بايكال","بحيرة قزوين","بحيرة فيكتوريا","بحيرة سوبريور","في سيبيريا الروسية"],
["أطول أنهار قارة أوروبا:","الفولجا","الدانوب","الراين","السين","يصب في بحر قزوين"],
["تُلقب هضبة (...) بـ «سقف العالم»:","التبت","الدكن","إيران","الأناضول","تقع في جنوب غرب الصين وهي أعلى هضاب العالم"],
["أكبر دول آسيا إنتاجًا للبترول:","السعودية","اليابان","الهند","كوريا الجنوبية","دولة عربية تطل على الخليج العربي والبحر الأحمر"],
["أكبر دول العالم إنتاجًا للفحم:","الصين","النرويج","مصر","هولندا","أكبر دولة في عدد السكان في شرق آسيا"],
["يشتهر منجم كيرونا بإنتاج خام الحديد في دولة:","السويد","النرويج","إسبانيا","اليونان","دولة في شمال أوروبا (إسكندنافيا) أشهر بالسيارات «فولفو»"],
["من أهم مناطق إنتاج البترول في أوروبا:","بحر الشمال","البحر المتوسط","بحر البلطيق","البحر الأدرياتيكي","يطل عليه بريطانيا والنرويج"],
["تشتهر ماليزيا وإندونيسيا بإنتاج معدن:","القصدير","الذهب","الفحم","النحاس","يدخل في صناعة علب الصفيح"],
["أهم مصدر للطاقة في النرويج بسبب كثرة الشلالات:","الطاقة الكهرومائية","الطاقة النووية","الفحم","الغاز الطبيعي","الماء المتدفق يولّد الكهرباء"],
["من أقدم الحضارات القديمة في الشرق الأدنى وهي حضارة:","السومريين","الحيثيين","الفرس","اليونان","أنشأت مدينة أور في جنوب العراق"],
["ابتكر السومريون الكتابة:","المسمارية","الهيروغليفية","الأبجدية","الصينية","كانت تُكتب على ألواح الطين"],
["حمورابي ملك مشهور عاصمته:","بابل","نينوى","مأرب","ممفيس","اشتهر بوضع أقدم القوانين المكتوبة"],
["الشعب الذي ابتكر الأبجدية ونقلها للإغريق:","الفينيقيون","الآشوريون","الحيثيون","البابليون","شعب بحارة على ساحل الشام (لبنان)"],
["كانت نينوى عاصمة:","الآشوريين","البابليين","السومريين","الفينيقيين","عُرفوا بقوة جيشهم"],
["اشتهر الملك نبوخذ نصر ببناء:","الحدائق المعلقة","سد مأرب","سور الصين","الجامع الأموي","إحدى عجائب الدنيا السبع القديمة في بابل"],
["عاصمة مملكة سبأ في اليمن القديم:","مأرب","ظفار","قرناو","تمنع","اشتهرت بسدها العظيم"],
["عاصمة مملكة معين في اليمن القديم:","قرناو","مأرب","ظفار","شبوة","اشتهرت بتجارة البخور واللبان"],
["عاصمة مملكة حمير في اليمن القديم:","ظفار","مأرب","قرناو","تمنع","وردت في اسم مدينة قرب صنعاء"],
["الهدف الرئيسي من بناء سور الصين العظيم:","الدفاع عن الحدود الشمالية","الري الزراعي","التجارة","الاحتفالات","حماية الصين من غارات الشعوب الشمالية"],
["قامت الحضارة الهندية القديمة على ضفاف نهري:","السند والجانج","دجلة والفرات","النيل والكونغو","الفولجا والدانوب","كلاهما في شبه القارة الهندية"],
["الفيلسوف الصيني صاحب التعاليم الأخلاقية المشهورة:","كونفوشيوس","بوذا","حمورابي","ماركو بولو","علّم الاحترام والأدب والنظام"],
["بداية التقويم الهجري توافق عام:","622م","610م","632م","570م","عام هجرة النبي ﷺ من مكة إلى المدينة"],
["أول مسجد بُني في الإسلام:","مسجد قباء","المسجد النبوي","المسجد الأقصى","المسجد الحرام","بُني عند وصول النبي ﷺ إلى المدينة"],
["مؤسس مدينة بغداد عاصمة الدولة العباسية:","أبو جعفر المنصور","هارون الرشيد","المأمون","معاوية بن أبي سفيان","ثاني الخلفاء العباسيين"],
["اشتهر العالم المسلم ابن الهيثم في علم:","البصريات","الجبر","الفلك","الطب","درس الضوء وتكوّن الصور وكتب «المناظر»"]
];

const $=id=>document.getElementById(id);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let order,i,score,hints,wrong,name,locked,hintUsed;

/* ===== الصوت ===== */
let AC;
function ctx(){return AC||(AC=new (window.AudioContext||window.webkitAudioContext)())}
let cur;function rev(big){try{if(cur)cur();const a=ctx(),t=a.currentTime,d=big?5:2.5;
 const g=a.createGain(),f=a.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(500,t);f.frequency.linearRampToValueAtTime(2400,t+d*.7);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.1);g.gain.setValueAtTime(.35,t+d-.8);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 f.connect(g);g.connect(a.destination);
 [["sawtooth",1],["square",.5]].forEach(([ty,m])=>{const o=a.createOscillator();o.type=ty;
  o.frequency.setValueAtTime(55*m,t);for(let k=0;k<2;k++){o.frequency.exponentialRampToValueAtTime((k%2?200:300+k*40)*m,t+d*(k+.5)/2.2);o.frequency.exponentialRampToValueAtTime(90*m,t+d*(k+1)/2.2)}o.frequency.exponentialRampToValueAtTime(60*m,t+d);
  const l=a.createOscillator();l.frequency.value=28;const lg=a.createGain();lg.gain.value=20*m;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+d);
  o.connect(f);o.start(t);o.stop(t+d)});cur=()=>{g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(g.gain.value,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.15)}}catch(e){}}
function bad(){try{const a=ctx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="square";
 o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(40,t+.4);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.4)}catch(e){}}

/* ===== الخلفية: خطوط سرعة + شرر ===== */
const cv=$("cv"),x=cv.getContext("2d");let W,H,lines=[],P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let k=0;k<70;k++)lines.push({x:Math.random()*2000,y:Math.random()*1200,l:40+Math.random()*160,s:6+Math.random()*16,c:Math.random()<.5?"0,229,255":"255,120,0"});
function burst(px,py,col){for(let k=0;k<50;k++){const a=Math.random()*6.28,s=2+Math.random()*7;P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:60+Math.random()*30,c:col||`hsl(${Math.random()*60+10},100%,60%)`})}}
(function loop(){x.clearRect(0,0,W,H);
 lines.forEach(n=>{n.x-=n.s;if(n.x+n.l<0){n.x=W+Math.random()*300;n.y=Math.random()*H}
  const g=x.createLinearGradient(n.x,0,n.x+n.l,0);g.addColorStop(0,`rgba(${n.c},0)`);g.addColorStop(1,`rgba(${n.c},.55)`);
  x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(n.x,n.y);x.lineTo(n.x+n.l,n.y);x.stroke()});
 P=P.filter(p=>p.life>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;x.globalAlpha=Math.max(p.life/60,0);x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5)});x.globalAlpha=1;
 requestAnimationFrame(loop)})();

/* ===== بوابة الاسم ===== */
$("start").onclick=()=>{
 const v=$("nm").value.trim();
 if(v.length<2){$("err").textContent="لازم تكتب اسمك الأول عشان تشوف الأسئلة 😉";$("nm").classList.remove("shake");void $("nm").offsetWidth;$("nm").classList.add("shake");return}
 name=v;order=shuf(Q.map((_,k)=>k));i=0;score=0;hints=0;wrong=[];
 $("gate").classList.add("hide");$("exam").classList.remove("hide");$("who").textContent="🏍️ "+name;
 rev(false);show();
};
$("nm").addEventListener("keydown",e=>{if(e.key==="Enter")$("start").click()});

/* ===== عرض سؤال ===== */
function show(){
 locked=false;hintUsed=false;
 const q=Q[order[i]],opts=shuf(q.slice(1,5).map((t,k)=>({t,ok:k===0})));
 $("cnt").textContent=`سؤال ${i+1} / ${Q.length}`;$("sc").textContent=`⭐ ${score}`;
 $("bike").style.right=(i/Q.length*88)+"%";
 const b=$("box");b.style.animation="none";void b.offsetWidth;b.style.animation="pop .45s";
 b.innerHTML=`<div class="q">${q[0]}</div>`;
 opts.forEach(o=>{const e=document.createElement("button");e.className="opt";e.textContent=o.t;e.onclick=()=>pick(e,o,opts);o.el=e;b.appendChild(e)});
 const h=document.createElement("div");h.innerHTML=`<div class="row"><button class="hint" id="hb">💡 تلميح</button></div><div id="hbox"></div>`;b.appendChild(h);
 $("hb").onclick=()=>{if(locked)return;if(!hintUsed){hintUsed=true;hints++}$("hbox").style.display="block";$("hbox").textContent="💡 "+q[5]};
}
function pick(el,o,opts){
 if(locked)return;locked=true;const q=Q[order[i]],r=el.getBoundingClientRect();
 opts.forEach(p=>{p.el.disabled=true;if(p.ok)p.el.classList.add("ok")});
 if(o.ok){score++;rev(false);burst(r.left+r.width/2,r.top+r.height/2);$("sc").textContent=`⭐ ${score}`;$("bike").style.right=((i+1)/Q.length*88)+"%"}
 else{el.classList.add("no");bad();$("box").classList.remove("shake");void $("box").offsetWidth;$("box").classList.add("shake");wrong.push({q:q[0],a:q[1],m:el.textContent})}
 const n=document.createElement("button");n.className="go";n.style.marginTop="14px";n.textContent=i<Q.length-1?"السؤال التالي ➜":"🏁 شوف النتيجة";
 n.onclick=()=>{i++;i<Q.length?show():finish()};$("box").appendChild(n);
}

/* ===== إرسال النتيجة ===== */
function send(){
 const body={"الاسم":name,"الدرجة":score+" / "+Q.length,"التلميحات المستخدمة":hints,"الأسئلة الغلط":wrong.length?wrong.map((w,k)=>(k+1)+") "+w.q+" | إجابته: "+w.m+" | الصح: "+w.a).join("\n"):"لا يوجد"};
 const set=(t,c)=>{const s=$("sent");if(s){s.textContent=t;s.style.color=c}};
 fetch("https://formspree.io/f/mvkganog",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)})
 .then(r=>r.ok?set("✅ تم إرسال النتيجة","#39ff88"):set("⚠️ فشل إرسال النتيجة","#ff2d55"))
 .catch(()=>set("⚠️ فشل إرسال النتيجة، تأكد من الإنترنت","#ff2d55"));
}

/* ===== النتيجة ===== */
function finish(){
 $("exam").classList.add("hide");const e=$("end");e.classList.remove("hide");
 const t=score>=27?"بطل الحلبة 🏆":score>=21?"سواق محترف 🏍️":score>=15?"مبتدئ سريع ⚡":"محتاج صيانة 🔧 ذاكر تاني";
 e.innerHTML=`<h1 style="font-size:30px">${name}</h1><div class="big">${score} / ${Q.length}</div>
 <p style="text-align:center;font-size:24px;font-weight:900;margin:8px 0">${t}</p>
 <p style="text-align:center;color:#ffd000">استخدمت التلميح ${hints} مرة</p>
 ${wrong.length?`<h3 style="margin-top:14px">راجع أخطاءك:</h3>`+wrong.map(w=>`<div class="rv">${w.q}<br><span style="color:var(--r)">إجابتك: ${w.m}</span> — <span style="color:var(--g)">الصح: ${w.a}</span></div>`).join(""):`<h3 style="text-align:center;margin-top:12px">ولا غلطة! 🔥</h3>`}
 <p id="sent" style="text-align:center;margin-top:14px;color:#ffd000">⏳ جاري إرسال النتيجة...</p>
 <button class="go" style="margin-top:16px" onclick="location.reload()">🔁 سباق جديد</button>`;
 send();
 rev(true);for(let k=0;k<6;k++)setTimeout(()=>burst(Math.random()*W,H*.4),k*250);
}
</script></body></html>
